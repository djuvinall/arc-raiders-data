name: refresh-data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      # The import tool lives in the app repository; this repository goes where it expects it.
      - uses: actions/checkout@v4
        with:
          repository: djuvinall/arc-raiders-companion
      - uses: actions/checkout@v4
        with:
          path: dataset
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p arc-ingest -- probe
      - run: cargo run -p arc-ingest -- sync --write
      - run: cargo test -p arc-core -p arc-ingest
      - name: Commit the new data
        working-directory: dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data fixtures
          git diff --cached --quiet || { git commit -m "Refresh dataset" && git push; }
