name: ci
on: [push, pull_request]
jobs:
  validate:
    # Report branches are validated by report-pr, which rebuilds data/ first.
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'report/') }}
    runs-on: ubuntu-latest
    steps:
      # Validates this data with the app's own tests.
      - uses: actions/checkout@v4
        with:
          repository: djuvinall/arc-raiders-companion
      - uses: actions/checkout@v4
        with:
          path: dataset
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p arc-core -p arc-ingest
